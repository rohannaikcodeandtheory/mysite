# Fastly local CLI sandbox: TEST/DRY RUN ONLY (the values below are fake).
# For actual DA requests use `npm run local` and gitignored .env.
name = "eds-sheet-edge-function"
description = "AEM Edge Functions EDS sheet writer"
authors = []
language = "javascript"
manifest_version = 3
service_id = ""

[scripts]
  post_init = "npm install"

[local_server]
  [local_server.config_stores]
    [local_server.config_stores.config_default]
      format = "inline-toml"
    [local_server.config_stores.config_default.contents]
      STAGE_API_HOST = "stage.example.com"
      MAIN_API_HOST = "production.example.com"
      DA_ORG_STAGE = "rohannaikcodeandtheory"
      DA_SITE_STAGE = "mysite"
      DA_ORG_MAIN = "rohannaikcodeandtheory"
      DA_SITE_MAIN = "mysite"
      IMS_SCOPES_STAGE = "oopenid,AdobeID,read_organizations,additional_info.projectedProductContext,read_pc.dma_aem_ams"
      IMS_SCOPES_MAIN = "oopenid,AdobeID,read_organizations,additional_info.projectedProductContext,read_pc.dma_aem_ams"

  [local_server.secret_stores]
    [[local_server.secret_stores.secret_default]]
      key = "INBOUND_API_KEY_STAGE"
      data = "LOCAL_DRY_RUN_DEMO_KEY_NEVER_USE_FOR_REAL_AUTH_12345"
    [[local_server.secret_stores.secret_default]]
      key = "IMS_CLIENT_ID_STAGE"
      data = "FAKE_LOCAL_CLIENT_ID"
    [[local_server.secret_stores.secret_default]]
      key = "IMS_CLIENT_SECRET_STAGE"
      data = "FAKE_LOCAL_CLIENT_SECRET"
