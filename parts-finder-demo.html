<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DRiV and MOOG Parts Finder demo">
<title>DRiV / MOOG — Parts Finder</title>
<link rel="stylesheet" href="/blocks/parts-finder/parts-finder.css">
<style>
body{margin:0;background:#f5f5f6;color:#101114;font-family:Arial,Helvetica,sans-serif}
.demo-nav{background:#101114;border-bottom:4px solid #d71920;padding:20px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.demo-nav strong{color:white;font-size:22px}.demo-nav span{color:#ff686e;font-size:12px;font-weight:700;letter-spacing:.08em}
.demo-footer{max-width:1200px;margin:0 auto;padding:20px 22px 40px;color:#646b76;font-size:12px}
.demo-error{max-width:1100px;margin:16px auto;padding:16px;background:#fff0f0;border-left:4px solid #d71920}
@media(max-width:640px){.demo-nav{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="demo-nav"><strong>DRiV <span>/ MOOG</span></strong><span>PARTS FINDER · CLIENT DEMONSTRATION</span></header>
<main><div class="parts-finder block" data-block-name="parts-finder" data-block-status="loading"></div></main>
<footer class="demo-footer">Demo environment. Brand codes and European mappings must be verified before production use.</footer>
<script type="module">
try {
 const {default: decorate} = await import('/blocks/parts-finder/parts-finder.js');
 const block=document.querySelector('.parts-finder');
 if(typeof decorate!=='function') throw new Error('Missing default decorator export');
 await decorate(block);
 block.dataset.blockStatus='loaded';
} catch(error) {
 console.error('Parts Finder failed to initialize',error);
 const message=document.createElement('p');
 message.className='demo-error';
 message.textContent='Parts Finder could not load. Check the browser console.';
 document.querySelector('main').prepend(message);
}
</script>
</body>
</html>
